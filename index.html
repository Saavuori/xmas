<style>
:root{--pine:#0E2A23;--pine2:#18402F;--cream:#F7F0E3;--cream2:#EDE2CC;--paper:#FFFBF3;--red:#B8283A;--gold:#E9B44C;--leaf:#8FBF8A;--deep:#1F5C45;--ink:#1B1F1D;--muted:#5D6A63;--line:#DCCFB6;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden;font-size:15px;line-height:1.45}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}
button{font:inherit;cursor:pointer}
/* header */
header{background:var(--pine);color:var(--cream);padding:10px 16px calc(10px);display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;flex:none}
.logo{width:42px;height:52px;flex:none}
.brand h1{font-size:24px;line-height:1}
.brand p{margin:2px 0 0;font-size:12px;color:#B9C7BF}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:2}
.lock{display:inline-flex;align-items:center;gap:6px;background:rgba(233,180,76,.14);border:1px solid rgba(233,180,76,.5);color:var(--gold);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.hbtn{background:rgba(247,240,227,.1);color:var(--cream);border:1px solid rgba(247,240,227,.25);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.hbtn:hover{background:rgba(247,240,227,.2)}
.snow{position:absolute;inset:0;pointer-events:none}
.snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120px)}}
/* tabs */
nav{display:flex;background:var(--pine2);flex:none}
.tab{flex:1;background:none;border:0;color:#B9C7BF;padding:10px 6px;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tab.on{color:var(--cream);border-bottom-color:var(--gold)}
main{flex:1;min-height:0;display:block;position:relative}
.panel{display:none;height:100%;overflow:auto}
.panel.on{display:block}
#chatPanel.on{display:flex}
#chatPanel{flex-direction:column}
@media(min-width:1100px){
 main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
 #chatPanel{display:flex!important;border-right:1px solid var(--line)}
 .tab[data-t=chat]{display:none}
 nav{padding-left:52.5%}
}
/* chat */
#log{flex:1;overflow:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:min(720px,94%);animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.msg.me{align-self:flex-end;background:var(--red);color:var(--cream);border-radius:18px 18px 4px 18px;padding:10px 14px}
.msg.elf{align-self:flex-start;display:flex;gap:8px;align-items:flex-start;width:100%}
.av{width:34px;height:34px;border-radius:50%;background:var(--pine);flex:none;display:flex;align-items:center;justify-content:center}
.av svg{width:24px;height:28px}
.bub{background:var(--paper);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;min-width:0;flex:1;max-width:680px}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.who{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--deep);text-transform:uppercase;margin-bottom:4px}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--deep);margin-right:4px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.compose{flex:none;border-top:1px solid var(--line);background:var(--cream);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chip{flex:none;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--pine);white-space:nowrap}
.chip:hover{border-color:var(--deep)}
form{display:flex;gap:8px}
#q{flex:1;border:2px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;font-size:16px;background:#fff;outline:none;min-width:0}
#q:focus{border-color:var(--deep)}
.send{background:var(--red);color:var(--cream);border:0;border-radius:999px;padding:0 18px;font-weight:700}
/* verdict card */
.vc-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vc-name{font-size:24px}
.vc-meta{color:var(--muted);font-size:13px}
.band{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.b-nice{background:var(--deep);color:var(--cream)}.b-lean{background:var(--leaf);color:var(--ink)}.b-rev{background:var(--gold);color:var(--ink)}.b-nudge{background:var(--red);color:var(--cream)}
.gauge{width:190px;height:118px;flex:none}

.stats{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.stat{background:var(--cream);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}
.sec{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:12px 0 4px}
.tl{width:100%;height:auto;display:block}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ev li:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.cite{color:var(--muted);font-size:12px;white-space:nowrap}
.brk{display:grid;grid-template-columns:96px 1fr 40px;gap:4px 8px;align-items:center;font-size:13px}

.sign{font-style:italic;color:var(--deep);margin-top:8px;font-size:14px}

details{margin-top:8px}summary{cursor:pointer;color:var(--deep);font-weight:600;font-size:13px}
.refuse{border-left:4px solid var(--red);padding-left:10px}

#search{width:100%;border:2px solid var(--line);border-radius:999px;padding:10px 14px;font:inherit;font-size:16px;background:#fff;outline:none}
.note{font-size:12px;color:var(--muted);margin-top:14px}

.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--pine);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .3s both}

.story{font-size:14px;line-height:1.6;background:var(--cream);border-radius:10px;padding:10px 12px}
.story .g{background:rgba(31,92,69,.16);border-bottom:2px solid #1F5C45;border-radius:3px}
.story .b{background:rgba(184,40,58,.13);border-bottom:2px solid #B8283A;border-radius:3px}

.wish{display:flex;gap:8px;align-items:center;background:#FDF3DF;border:1px dashed #E0B860;border-radius:10px;padding:7px 10px;margin-top:10px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act{background:var(--pine);color:var(--cream);border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.act.alt{background:var(--gold);color:var(--ink)}
.act:hover{filter:brightness(1.12)}
.drawer{margin-top:10px;background:#FFF6E6;border:2px dashed var(--gold);border-radius:12px;padding:10px}
.drawer textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:16px;resize:vertical}
.drawer select{border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:14px;background:#fff}
.drawer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sealbtn{border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}
.stamp{display:inline-block;border:5px solid currentColor;border-radius:12px;padding:6px 16px;font-family:Fraunces,serif;font-size:26px;font-weight:800;letter-spacing:.04em;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;margin:6px 0 10px}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}}
.sealed{display:inline-block;background:var(--ink);color:var(--gold);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12px;margin-left:4px}
.spirit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spirit input{flex:1;min-width:160px;accent-color:var(--red)}
.spirit .face{font-size:34px;line-height:1;transition:transform .3s}
.ovl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clear{background:none;border:1px solid var(--red);color:var(--red);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.delta{font-weight:800}
@media(max-width:600px){.hdr-right{flex-wrap:nowrap}.hbtn .t{display:none}.lock{max-width:130px;overflow:hidden;text-overflow:ellipsis}.lock .t{overflow:hidden;text-overflow:ellipsis}.brand p{display:none}.tab{font-size:13px}}
</style></head>

<script>
const DEMO_CSV = "Child name,\"Location\",\"age\",\"What they want for present\",\"behavior during the year\"\nLumi Hakala,\"Tampere, Finland\",\"11\",\"a sled shaped like a rocket\",\"At the start of the year Lumi teased her little brother constantly and slammed doors whenever she lost at board games. In March she apologised to him and started reading him bedtime stories every night. During the summer she volunteered at the animal shelter and helped walk the dogs. In autumn she tutored a classmate in maths. Lately she has been kind to everyone at school, though she still sneaks cookies before dinner.\"\nVeeti Lahtinen,\"Oulu, Finland\",\"9\",\"a glow-in-the-dark dinosaur skeleton\",\"Veeti always shares his snacks and invited the new kid to join his football team in spring. In February he shovelled the neighbour's driveway every week without being asked. In summer he returned a lost wallet to the police. Recently he comforted a friend whose cat ran away.\"\nIida Salo,\"Turku, Finland\",\"14\",\"a drum kit (the neighbours hope not)\",\"Early in the year Iida forgot her homework often and practised the drums very loudly at midnight. In May she blamed her sister for a broken vase. During the summer she helped at her grandmother's cafe. In October she lied about finishing her chores.\"\nAstrid Holm,\"Gothenburg, Sweden\",\"12\",\"a pocket-sized planetarium\",\"Astrid organised a book swap at school in February. She was patient with her grandfather and helped him learn to video call. In summer she rescued a hedgehog from a drain. By the end of the year she was tutoring three younger kids in reading.\"\nViktor Ek,\"Gothenburg, Sweden\",\"15\",\"noise-cancelling headphones\",\"Viktor was rude to his teachers early in the year and fought with his brother. In spring he copied a friend's essay. In summer he got into a fight at the skate park. Lately he has been mostly the same, although he once helped carry groceries for a neighbour.\"\nSigrid Berg,\"Bergen, Norway\",\"10\",\"a waterproof camera for fjord fish\",\"Sigrid moved to Bergen in November. She seems friendly.\"\nMathias Strand,\"Bergen, Norway\",\"13\",\"a remote-controlled submarine\",\"Mathias pranked his class with a whoopee cushion in January. In April he bullied a younger boy on the bus. Then in June he apologised and stood up for the same boy when others teased him. In autumn he helped coach the junior football team. Recently he has been gentle and patient with his little cousins.\"\nIda Mortensen,\"Aarhus, Denmark\",\"8\",\"a unicorn pi\u00f1ata filled with stickers\",\"In spring Ida painted the cat with yoghurt and made a huge mess in the kitchen. In summer she shared her toys with her cousins and gave her birthday money to charity. In autumn she drew on the wall with crayons, but she cleaned it up herself and admitted it right away.\"\nKofi Mensah,\"Accra, Ghana\",\"12\",\"a solar-powered radio\",\"Kofi helped his mother at the market every Saturday. He taught his younger sisters to read and always shared his lunch. In autumn he organised a football tournament for the neighbourhood kids.\"\nSakura Ito,\"Kyoto, Japan\",\"10\",\"a robot that folds origami\",\"Sakura is very polite and thoughtful. In spring she visited her grandmother in hospital every week. She sometimes stays up late reading manga. Lately she has been cleaning the temple garden with volunteers.\"\nMateo Silva,\"Lisbon, Portugal\",\"11\",\"a skateboard with flame stickers\",\"Early in the year Mateo was kind to his friends but kept teasing his sister. In summer he stole a chocolate bar from the corner shop. Then he confessed and paid it back with his pocket money. In autumn he helped fix bikes at school but skipped his homework all month.\"\nOlivia Brown,\"Denver, USA\",\"9\",\"a pet tarantula named Fluffy\",\"Olivia excluded a new girl from her party in January and spread rumours at school. In summer she pushed her brother into the pool. In autumn she yelled at her teacher. Lately she refused to share anything with her classmates.\"\nLiam O'Connor,\"Dublin, Ireland\",\"7\",\"a cape that really flies\",\"Liam always says thank you and helps set the table. In spring he made a get-well card for his teacher. He sometimes leaves mud on the carpet. Recently he gave his favourite teddy to his baby sister.\"\nEmilia Nowak,\"Krak\u00f3w, Poland\",\"16\",\"driving lessons\",\"Emilia babysat the neighbour's twins every weekend and never complained. In summer she volunteered at a youth camp. In autumn she admitted she dented her dad's car and apologised.\"\n";
/* ================= helpers ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const FLAG={finland:'🇫🇮',sweden:'🇸🇪',norway:'🇳🇴',denmark:'🇩🇰',iceland:'🇮🇸',estonia:'🇪🇪',japan:'🇯🇵',kenya:'🇰🇪',ghana:'🇬🇭',brazil:'🇧🇷',usa:'🇺🇸','united states':'🇺🇸',canada:'🇨🇦',germany:'🇩🇪',uk:'🇬🇧','united kingdom':'🇬🇧',england:'🇬🇧',ireland:'🇮🇪',france:'🇫🇷',spain:'🇪🇸',portugal:'🇵🇹',italy:'🇮🇹',poland:'🇵🇱',netherlands:'🇳🇱',belgium:'🇧🇪',austria:'🇦🇹',switzerland:'🇨🇭',india:'🇮🇳',china:'🇨🇳',australia:'🇦🇺',mexico:'🇲🇽',argentina:'🇦🇷',egypt:'🇪🇬','south africa':'🇿🇦',nigeria:'🇳🇬','south korea':'🇰🇷',korea:'🇰🇷'};
const flag=c=>FLAG[(c||'').toLowerCase().trim()]||'🌍';
const YEAR=new Date().getFullYear();
const dateFrom=d=>new Date(YEAR,0,1+Math.round(d*364));
const whenLabel=d=>d<0.2?'early in the year':d<0.4?'spring':d<0.62?'summer':d<0.82?'autumn':'late in the year';
const fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const dotc=w=>w>0?'#1F5C45':w<0?'#B8283A':'#E9B44C';

/* ================= CSV ================= */
function parseCSV(t){
 const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
 const first=t.split(/\r?\n/)[0];const sep=first.split(';').length>first.split(',').length?';':first.split('\t').length>first.split(',').length?'\t':',';
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==sep){row.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
  else f+=c}
 row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}

/* ================= the reading brain ================= */
const WEIGHT={Kindness:3,Honesty:3,Helpfulness:2,Chores:1,Mischief:-1,Unkindness:-3,Dishonesty:-3,Growth:2,Refused:-2};
const CAT_ALIAS={kind:'Kindness',kindness:'Kindness',honest:'Honesty',honesty:'Honesty',help:'Helpfulness',helpful:'Helpfulness',helpfulness:'Helpfulness',chore:'Chores',chores:'Chores',mischief:'Mischief',prank:'Mischief',unkind:'Unkindness',unkindness:'Unkindness',mean:'Unkindness',dishonest:'Dishonesty',dishonesty:'Dishonesty',lie:'Dishonesty',lying:'Dishonesty'};
const LEX=[
 ['Kindness',3,/\b(kind(ness|ly)?(?! of)|shar(e|ed|es|ing)|gave|gives?|given|giving|donat\w*|comfort\w*|cheer(ed|ing|s)? (\w+ )?up|invit\w*|includ(ed|es|ing)|cared for|car(es|ing) for|look(ed|s|ing)? after|volunteer\w*|hug(s|ged|ging)?|stood up for|stand(s|ing)? up for|defend\w*|welcom\w*|thank(s|ed|ing)?|thank you|compliment\w*|gentle|generous|patient|patience|encourag\w*|rescu\w*|adopt\w*|visit(ed|s|ing)?|befriend\w*|made friends|friendly|considerate|thoughtful|polite(ly)?|grateful|get-well card|card for|letters? to|charity|forgave|forgiv\w*)\b/],
 ['Helpfulness',2,/\b(help(ed|s|ing|ful)?|tutor\w*|taught|teach(es|ing)?|assist\w*|carri(ed|es)|carry(ing)?|fix(ed|es|ing)?|repair\w*|organi[sz]\w*|babysat|babysit\w*|guid(ed|es|ing)|mentor\w*|coach\w*|baked (\w+ )*for|cooked (\w+ )*for|set the table|walk(ed|s|ing)? the dogs?)\b/],
 ['Honesty',3,/\b(apologi[sz]\w*|admit(s|ted|ting)?|confess\w*|told the truth|tell(s|ing)? the truth|truthful|honest(ly|y)?|owned up|own(s|ed)? up|returned (the|a|an|his|her|their)|handed (it )?in|came clean|paid it back)\b/],
 ['Chores',1,/\b(chores?|tid(y|ied|ies|ying)( up)?|clean(ed|s|ing)?|wash(ed|es|ing)?|dishes|laundry|vacuum\w*|rak(ed|ing)|shovel\w*|made (his|her|their) bed|took out the|(did|finished|does|finishes) (his|her|their) homework|practi[cs](ed|es|ing)?|stud(ied|ies|y|ying)|work(ed|s|ing)? hard|diligent\w*|responsib\w*|punctual|saved (up|money|pocket))\b/],
 ['Mischief',-1,/\b(prank\w*|mischie\w*|sneak(s|ed|ing)?|snuck|glitter|toothpaste|mess(y|ed)?|mud|muddy|slime|water balloons?|whoopee|stay(ed|s|ing)? up late|forg(ot|ets|etting)|late for|noisy|loud(ly)?|chaos|chaotic|tricked|spill(ed|s|ing)?|broke|broken|smash\w*|scribbl\w*|drew on|painted the|hid(ing)? (the|her|his|their)|complain\w*|whin(ed|es|ing|y)|grumbl\w*|sulk\w*|stubborn|lazy|procrastinat\w*|skipp?(ed|ing)|naughty)\b/],
 ['Unkindness',-3,/\b(bull(y|ied|ies|ying)|teas(e|ed|es|ing)|mean|push(ed|es|ing)?|shov(ed|ing)|hit(s|ting)?|kick(ed|s|ing)?|bit|bites?|punch\w*|shout(ed|s|ing)? at|yell(ed|s|ing)?|scream(ed|s|ing)? at|insult\w*|called (\w+ )?names|name-calling|exclud\w*|left (\w+ )*out|rude(ly|ness)?|fight(s|ing)?|fought|tantrums?|slamm\w*|mock\w*|laugh(ed|s|ing)? at|threw|throw(s|ing)?|selfish|bossy|spiteful|grabb\w*|snatch\w*|cruel|nasty|gossip\w*|rumou?rs?|unkind)\b/],
 ['Dishonesty',-3,/\b(lie[ds]?|lying|liar|cheat\w*|copi(ed|es)|copy(ing)?|blam(ed|es|ing)|stole|steal\w*|stolen|fib\w*|pretend(ed|s|ing)? to be sick|deceiv\w*|shoplift\w*|dishonest\w*)\b/],
].map(([c,w,re])=>[c,w,new RegExp(re.source,'gi')]);
const NEG=/\b(never|not|no longer|didn'?t|did not|doesn'?t|does not|don'?t|wouldn'?t|won'?t|refus(ed|es|ing) to|stopp?(ed|s|ing)?|quit|without|instead of|avoid(ed|s)?)\b/;
const MORE=/\b(always|every|constantly|repeatedly|often|kept|daily|weekly|countless|lots of|so much|very|extremely|huge|all month|all year)\b/;
const LESS=/\b(once|occasionally|a little|sometimes|slightly|a bit|one time|minor)\b/;
const TIME=[[/\b(january|new year|start of the year|beginning of the year|early in the year|early on|at first|in the beginning)\b/,0.05],[/\bfebruary\b/,0.12],[/\bmarch\b/,0.2],[/\b(april|easter)\b/,0.28],[/\bspring\b/,0.3],[/\bin may\b/,0.36],[/\b(june|midsummer)\b/,0.44],[/\b(july|summer)\b/,0.52],[/\baugust\b/,0.6],[/\b(september|back to school|school started)\b/,0.68],[/\b(october|autumn|fall|halloween)\b/,0.76],[/\bnovember\b/,0.85],[/\b(december|christmas|lately|recently|these days|nowadays|by the end|end of the year|this month)\b/,0.93]];
const SPLIT=/(,?\s*\bbut\b\s*|;\s*|,?\s*\bhowever\b,?\s*|,?\s*\balthough\b\s*|,?\s*\bthough\b\s*|,?\s*\band then\b\s*|,?\s*\bafter that\b,?\s*)/i;

function scoreClause(p){
 const l=p.toLowerCase();const m=[];
 for(const[cat,base,re]of LEX){re.lastIndex=0;let x;while((x=re.exec(l))){
  const before=l.slice(0,x.index).trim().split(/\s+/).slice(-4).join(' ');const neg=NEG.test(before);
  m.push({w:neg?-base*0.7:base,cat:neg?(base<0?'Growth':'Refused'):cat,i:x.index,word:x[0]})}}
 if(!m.length)return null;
 const k=MORE.test(l)?1.4:LESS.test(l)?0.6:1;
 m.sort((a,b)=>Math.abs(b.w)-Math.abs(a.w)||a.i-b.i);const d=m[0];
 const extra=m.slice(1).filter(x=>Math.sign(x.w)===Math.sign(d.w)).reduce((s,x)=>s+x.w*0.3,0);
 return{w:clamp((d.w+extra)*k,-4.5,4.5),cat:d.cat,word:d.word}}

function readStory(story){
 const sents=story.split(/(?<=[.!?])\s+/).filter(s=>s.trim());const pieces=[],signals=[];
 sents.forEach((s,i)=>{let t=null;const sl=s.toLowerCase();for(const[re,v]of TIME)if(re.test(sl)){t=v;break}
  if(t===null)t=0.08+0.84*(sents.length>1?i/(sents.length-1):0.5);
  s.split(SPLIT).forEach((p,j)=>{if(j%2||!p.trim()){pieces.push({text:p,w:0});return}
   const r=scoreClause(p);pieces.push({text:p,w:r?r.w:0});if(r)signals.push({text:p.trim().replace(/^[a-z]/,c=>c.toUpperCase()),w:r.w,category:r.cat,doy:t})});
  pieces.push({text:' ',w:0})});
 return{pieces,signals}}

/* ================= loading (read-only) ================= */
let RAW=[],INFO={},SOURCE='',MODE='',HAS_ELVES=false,KIDS=[];
function load(text,name){
 let rows=parseCSV(text);
 if(rows.length&&rows[0].length===1&&/,|;/.test(rows[0][0]))rows=rows.map(r=>parseCSV(r.join(','))[0]||[]); // whole line wrapped in quotes
 if(rows.length<2)throw new Error('That file has no data rows.');
 const head=rows[0].map(h=>h.trim().toLowerCase());
 const find=(...tests)=>head.findIndex(h=>tests.some(t=>typeof t==='string'?h===t:t.test(h)));
 const c={child:find('child','name','title','lapsi',/child.?name/,/^name/),loc:find(/location|sijainti/),age:find('age','ikä',/^age\b/),country:find('country','maa'),city:find('city','town','kaupunki'),
  wish:find(/present|wish|gift|lahja|toive/),story:find(/behaviou?r|story|käytös|description of/),date:find('date','observed','created','päivä','pvm',/date/),elf:find('elf','reporter','reported by','reporting elf','tonttu',/elf/),category:find('category','type','kategoria'),obs:find('observation','notes','details','comment','havainto','description')};
 if(c.child<0)c.child=0;
 const raw=[],info={};
 if(c.story>=0){MODE='story';HAS_ELVES=false}
 else if(c.date>=0&&c.category>=0){MODE='log';HAS_ELVES=c.elf>=0}
 else throw new Error('I need either a behaviour/story column, or date + category columns. Found: '+rows[0].join(' | '));
 rows.slice(1).forEach((r,n)=>{const g=i=>i>=0?(r[i]||'').trim():'';const child=g(c.child);if(!child)return;
  let city=g(c.city),country=g(c.country);const loc=g(c.loc);
  if(loc&&!country){const k=loc.lastIndexOf(',');if(k>0){city=city||loc.slice(0,k).trim();country=loc.slice(k+1).trim()}else country=loc}
  const I=info[child]||(info[child]={name:child,age:g(c.age),city,country,wish:g(c.wish),pieces:[],row:n+2});
  if(MODE==='story'){const st=readStory(g(c.story));I.pieces=st.pieces;I.story=g(c.story);
   st.signals.forEach(s=>raw.push(Object.freeze({id:n+2,child,elf:'',...s,date:dateFrom(s.doy),when:whenLabel(s.doy)})))}
  else{const d=new Date(g(c.date));if(isNaN(d))return;const rc=g(c.category);const cat=CAT_ALIAS[rc.toLowerCase()]||rc;let w=WEIGHT[cat];let category=cat;
   if(w===undefined){const s=scoreClause(g(c.obs));w=s?s.w:0;category=s?s.cat:cat}
   const dd=(d-new Date(d.getFullYear(),0,1))/(365*864e5);raw.push(Object.freeze({id:n+2,child,elf:g(c.elf)||'Unknown',category,w,text:g(c.obs)||rc,doy:dd,date:d,when:whenLabel(dd)}))}});
 if(!Object.keys(info).length)throw new Error('No children found in that file.');
 RAW=Object.freeze(raw);INFO=info;SOURCE=name;loadOV();recompute();
 document.getElementById('src').textContent='Read-only · '+name;}

/* ================= Santa's override layer (never touches the list) ================= */
let OV={notes:{},seals:{},spirit:0};
const ovKey=()=>'elfred-ov:'+SOURCE;
function loadOV(){try{OV=JSON.parse(localStorage.getItem(ovKey()))||{notes:{},seals:{},spirit:0}}catch(e){OV={notes:{},seals:{},spirit:0}}}
function saveOV(){try{localStorage.setItem(ovKey(),JSON.stringify(OV))}catch(e){}}
const ovCount=()=>Object.values(OV.notes).reduce((s,a)=>s+a.length,0)+Object.keys(OV.seals).length;

/* ================= judgement ================= */
const BANDS={nice:['Clearly Nice','b-nice','#1F5C45'],lean:['Leaning Nice','b-lean','#8FBF8A'],rev:['Santa Review','b-rev','#E9B44C'],nudge:['Needs a Nudge','b-nudge','#B8283A']};
function assess(name){
 const I=INFO[name];
 const notes=(OV.notes[name]||[]).map((n,j)=>{const s=scoreClause(n.text);return s?{id:'✍️',child:name,elf:'Santa',santa:true,text:n.text,w:s.w,category:s.cat,doy:n.doy,date:dateFrom(n.doy),when:whenLabel(n.doy),j}:null}).filter(Boolean);
 const obs=[...RAW.filter(r=>r.child===name),...notes].sort((a,b)=>a.doy-b.doy);
 const elves=new Set(obs.filter(o=>!o.santa).map(o=>o.elf));
 const posE=new Set(obs.filter(o=>o.w>0&&!o.santa).map(o=>o.elf)),negE=new Set(obs.filter(o=>o.w<0&&!o.santa).map(o=>o.elf));
 let num=0,den=0;const byCat={};
 const scored=obs.map(o=>{const rec=0.4+0.6*clamp(o.doy,0,1);const same=o.w>0?posE:negE;const corr=(!HAS_ELVES||o.santa||o.w===0)?1:(same.size>1?1:0.75);
  const v=rec*o.w*corr;num+=v;den+=rec*3*corr;byCat[o.category]=(byCat[o.category]||0)+v;return{...o,rec,corr,v}});
 const score=den?clamp(num/den,-1,1):0;
 const e=obs.filter(o=>o.doy<0.5),l=obs.filter(o=>o.doy>=0.5);const avg=a=>a.reduce((s,o)=>s+o.w,0)/a.length;
 const trend=e.length&&l.length?(avg(l)-avg(e)>1?'improving':avg(l)-avg(e)<-1?'slipping':'steady'):'not enough to tell';
 const thin=obs.length<(MODE==='story'?2:3);
 const conflict=HAS_ELVES&&posE.size>0&&negE.size>0&&[...posE].every(x=>!negE.has(x))&&Math.abs(score)<0.35;
 const sp=OV.spirit||0;const reasons=[];if(thin)reasons.push('thin data');if(conflict)reasons.push('elves disagree');
 let band;
 if(thin||conflict)band='rev';else if(score>=0.6-sp)band='nice';else if(score>=0.15-sp)band='lean';else if(score>-0.15-sp){band='rev';reasons.push('borderline')}else band='nudge';
 const conf=thin?'low':MODE==='story'?(obs.length>=5?'high':obs.length>=3?'medium':'low'):(obs.length>=6&&elves.size>=2?'high':obs.length>=4?'medium':'low');
 let key=[...scored].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,4);
 const worst=scored.filter(o=>o.w<0).sort((a,b)=>a.v-b.v)[0];if(worst&&!key.includes(worst))key[key.length-1]=worst;
 scored.filter(o=>o.santa).forEach(o=>{if(!key.includes(o))key.push(o)});key.sort((a,b)=>a.doy-b.doy);
 const seal=OV.seals[name];
 return{...I,obs:scored,elves,score,band,final:seal||band,seal,conf,trend,reasons,key,byCat,notes:notes.length}}
function recompute(){KIDS=Object.keys(INFO).map(assess).sort((a,b)=>b.score-a.score);renderDash();renderKids();renderChips()}
const K=n=>KIDS.find(k=>k.name===n);

/* ================= visuals ================= */
function pt(s,r){const t=Math.PI*(1-(s+1)/2);return[110+r*Math.cos(t),110-r*Math.sin(t)]}
function arc(a,b,col){const[x1,y1]=pt(a,88),[x2,y2]=pt(b,88);return`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A88 88 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${col}" stroke-width="20" fill="none"/>`}
function gauge(k,from){const sp=OV.spirit||0;const a=-0.15-sp,b=0.15-sp,c=0.6-sp;const r=s=>(clamp(s,-1,1)*90).toFixed(1);
 return`<svg class="gauge" viewBox="0 0 220 122" aria-label="Nice-o-meter">${arc(-1,a,'#B8283A')}${arc(a,b,'#E9B44C')}${arc(b,c,'#8FBF8A')}${arc(c,1,'#1F5C45')}
<text x="10" y="121" font-size="10" fill="#5D6A63">naughty</text><text x="186" y="121" font-size="10" fill="#5D6A63">nice</text>
<g class="needle" style="transform:rotate(${from===undefined?-90:r(from)}deg)" data-r="${r(k.score)}"><line x1="110" y1="110" x2="110" y2="34" stroke="#1B1F1D" stroke-width="5" stroke-linecap="round"/></g><circle cx="110" cy="110" r="10" fill="#1B1F1D"/><circle cx="110" cy="110" r="4" fill="#E9B44C"/></svg>`}
function timeline(k){const W=600,H=130,b=68;let s=`<svg class="tl" viewBox="0 0 ${W} ${H}" aria-label="Behaviour timeline"><line x1="10" y1="${b}" x2="${W-10}" y2="${b}" stroke="#DCCFB6" stroke-width="2"/>`;
 'JFMAMJJASOND'.split('').forEach((m,i)=>{const x=20+i*(W-40)/11;s+=`<text x="${x}" y="${H-4}" font-size="11" text-anchor="middle" fill="#5D6A63">${m}</text>`});
 k.obs.forEach((o,i)=>{const x=20+clamp(o.doy,0,1)*(W-40);const y=b-o.w*12;const c=o.santa?'#E9B44C':dotc(o.w);
  s+=`<line x1="${x.toFixed(1)}" y1="${b}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="2" opacity=".5"/>${o.santa?`<text x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}" font-size="18" text-anchor="middle" style="animation:pop .4s ${(i*.07).toFixed(2)}s both">🎅</text>`:`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(5+Math.abs(o.w)*1.5).toFixed(1)}" fill="${c}" style="animation:pop .4s ${(i*.07).toFixed(2)}s both"><title>${esc(o.when)} · ${esc(o.category)} · ${esc(o.text)}</title></circle>`}`});
 return s+`<text x="12" y="16" font-size="11" fill="#1F5C45">▲ good deeds</text><text x="12" y="${b+40}" font-size="11" fill="#B8283A">▼ slips</text></svg>`}

function suggestion(k){const top=Object.entries(k.byCat).sort((a,b)=>b[1]-a[1])[0];const low=Object.entries(k.byCat).sort((a,b)=>a[1]-b[1])[0];
 const t=top&&top[1]>0?top[0].toLowerCase():'effort';const w=k.wish?`<b>${esc(k.wish)}</b>`:'the gift';const f=k.final;
 if(f==='nice')return`✅ Approve the wish: ${w}. Add a thank-you note for their ${t}.`;
 if(f==='lean')return`✅ Approve ${w}, with a note praising their ${t}${k.trend==='improving'?' and how much they have grown this year':''}.`;
 if(f==='rev')return k.reasons.includes('thin data')?`🔎 Only ${k.obs.length} clue${k.obs.length===1?'':'s'} about ${esc(k.name.split(' ')[0])}. Send an elf to ${esc(k.city||k.country)}, or add a Santa's note below.`:k.reasons.includes('elves disagree')?`🔎 The elves see two different children here. Read the entries yourself, Santa.`:`🔎 Right on the line. Hold ${w} until you've decided.`;
 const fix=low?low[0].replace('Unkindness','kindness').replace('Dishonesty','honesty').replace('Mischief','calmer adventures').replace('Refused','sharing').toLowerCase():'better choices';
 return`💌 A smaller version of ${w} and a kind note encouraging ${fix}. No coal. Kids change.`}

function storyHTML(k){if(MODE!=='story'||!k.pieces.length)return'';
 return`<div class="sec">The story, highlighted</div><div class="story">${k.pieces.map(p=>p.w>0?`<span class="g">${esc(p.text)}</span>`:p.w<0?`<span class="b">${esc(p.text)}</span>`:esc(p.text)).join('')}${(OV.notes[k.name]||[]).map(n=>` <span class="s">🎅 ${esc(n.text)}</span>`).join('')}</div>`}

function card(k,from){const B=BANDS[k.final];const nm=esc(k.name);
 const maxAbs=Math.max(...Object.values(k.byCat).map(Math.abs),0.01);
 const sealInfo=k.seal?`<div style="margin-top:6px"><span class="sealed">🖋 SANTA'S SEAL</span> <span class="vc-meta">ELFRED suggested ${BANDS[k.band][0]}</span></div>`:'';
 return`<div class="vcard"><div class="vc-top">${gauge(k,from)}<div><div class="vc-name serif">${nm} ${flag(k.country)}</div>
 <div class="vc-meta">${esc(k.age?k.age+' yrs · ':'')}${esc(k.city?k.city+', ':'')}${esc(k.country)}</div>
 <div style="margin-top:6px"><span class="band ${B[1]}">${B[0]}</span></div>${sealInfo}
 ${k.reasons.length&&!k.seal?`<div style="margin-top:6px">${k.reasons.map(r=>`<span class="flag-r">⚠ ${r}</span>`).join('')}</div>`:''}</div></div>
 ${k.wish?`<div class="wish">🎁 <span>Wishes for: <b>${esc(k.wish)}</b></span></div>`:''}
 <div class="stats"><span class="stat">Confidence <b>${k.conf}</b></span><span class="stat"><b>${k.obs.length}</b> ${MODE==='story'?'signals in the story':'observations'}</span>${HAS_ELVES?`<span class="stat"><b>${k.elves.size}</b> elves</span>`:''}${k.notes?`<span class="stat">🎅 <b>${k.notes}</b> Santa's note${k.notes>1?'s':''}</span>`:''}<span class="stat">Trend <b>${k.trend}</b></span><span class="stat">Score <b>${k.score>0?'+':''}${k.score.toFixed(2)}</b></span></div>
 <div class="sec">The year at a glance</div>${timeline(k)}
 ${storyHTML(k)}
 <div class="sec">Key evidence</div><ul class="ev">${k.key.map(o=>`<li><span class="dot" style="background:${o.santa?'#E9B44C':dotc(o.w)}"></span><span style="flex:1">${o.santa?'🎅 ':''}${esc(o.text)}</span><span class="cite">${o.santa?'Santa\'s note · '+esc(o.when):HAS_ELVES?`${fmt(o.date)} · Elf ${esc(o.elf)} · row ${o.id}`:`${esc(o.when)} · row ${o.id}`}</span></li>`).join('')||'<li>No clear good deeds or slips found.</li>'}</ul>
 <details><summary>Why this verdict? Show the maths</summary><div class="brk" style="margin-top:8px">${Object.entries(k.byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span>${esc(c)}</span><span><span class="bar" style="display:block;width:${Math.max(4,Math.abs(v)/maxAbs*100)}%;background:${v>=0?'#1F5C45':'#B8283A'}"></span></span><span style="text-align:right">${v>0?'+':''}${v.toFixed(1)}</span>`).join('')}</div>
 <p class="vc-meta" style="margin-top:6px">${MODE==='story'?'ELFRED reads the story clause by clause, spots good deeds and slips, notices words like <i>always/once</i> and <i>never/stopped</i>, and estimates when in the year each happened. ':''}Recent months count up to 2.5× more than January. Kindness and honesty ±3, helpfulness +2, chores +1, mischief −1.${OV.spirit?` Christmas spirit dial: ${OV.spirit>0?'+':''}${OV.spirit.toFixed(2)}.`:''}</p></details>
 <div class="suggest">${suggestion(k)}</div><div class="sign">Final call is yours, Santa. 🎅</div>
 <div class="acts"><button class="act" data-act="note" data-kid="${nm}">✍️ Add Santa's note</button><button class="act alt" data-act="seal" data-kid="${nm}">🖋 Santa's seal</button></div>
 <div class="drawer" data-drawer="note" hidden><b>✍️ Tell ELFRED something the elves missed</b><textarea placeholder="e.g. She baked cookies for the reindeer and shared them with the whole stable"></textarea>

const first=n=>n.split(/\s+/)[0];
function findKid(t){const l=t.toLowerCase();const reN=s=>new RegExp('(^|[^\\p{L}])'+s.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^\\p{L}]|$)','u');
 const full=KIDS.filter(k=>reN(k.name).test(l));if(full.length)return full;return KIDS.filter(k=>reN(first(k.name)).test(l))}
function findPlace(t){const l=t.toLowerCase();const al={suomi:'finland',sverige:'sweden',norge:'norway',danmark:'denmark',america:'usa',deutschland:'germany'};
 for(const[a,c]of Object.entries(al))if(new RegExp('\\b'+a+'\\b').test(l)){const v=KIDS.find(k=>k.country.toLowerCase()===c)?.country;if(v)return{type:'country',v}}
 const cs=[...new Set(KIDS.map(k=>k.country))].filter(Boolean).find(c=>l.includes(c.toLowerCase()));if(cs)return{type:'country',v:cs};
 const ci=[...new Set(KIDS.map(k=>k.city))].filter(Boolean).find(c=>l.includes(c.toLowerCase()));if(ci)return{type:'city',v:ci};return null}
const inPlace=p=>KIDS.filter(k=>p.type==='country'?k.country===p.v:k.city===p.v);
const chipB=k=>`<span class="band ${BANDS[k.final][1]}" style="font-size:11px">${BANDS[k.final][0]}</span>${k.seal?' 🖋':''}`;
function listHTML(arr,extra){return`<ul class="mini-list">${arr.map(k=>`<li data-kid="${esc(k.name)}"><span>${flag(k.country)}</span><span class="nm">${esc(k.name)}</span><span class="vc-meta">${esc(k.city||k.country)}</span><span style="margin-left:auto;text-align:right">${chipB(k)}${extra?extra(k):''}</span></li>`).join('')}</ul>`}
const reasonChips=k=>' '+k.reasons.map(r=>`<span class="flag-r">${r}</span>`).join('');
function bigbar(group){const c={nice:0,lean:0,rev:0,nudge:0};group.forEach(k=>c[k.final]++);
 return`<div class="bigbar">${Object.entries(c).filter(([,v])=>v).map(([b,v])=>`<div style="flex:${v};background:${BANDS[b][2]};color:${b==='lean'||b==='rev'?'#1B1F1D':'#F7F0E3'}">${v}</div>`).join('')}</div><div class="legend">${Object.keys(c).map(b=>`<span style="--c:${BANDS[b][2]}">${BANDS[b][0]} · ${c[b]}</span>`).join('')}</div>`}
function summary(group,label){const rev=group.filter(k=>k.final==='rev');
 return`<p><b>${esc(label)}</b>: ${group.length} child${group.length>1?'ren':''}.</p>${bigbar(group)}${rev.length?`<div class="sec">Needs your eyes</div>${listHTML(rev,reasonChips)}`:'<p class="sign">No borderline cases here. Easy one, Santa!</p>'}`}
const bandWord=l=>/clearly nice|very nice|super nice|angel/.test(l)?'nice':/leaning|mostly nice|kinda nice|nice-ish/.test(l)?'lean':/nice list|\bnice\b|good/.test(l)?'nice':/naught|nudge|coal|bad/.test(l)?'nudge':/review|unsure|undecided|maybe/.test(l)?'rev':null;

function answer(t){
 const l=t.toLowerCase();asked++;const kids=findKid(t);const place=findPlace(t);
 // Santa's seal: "put Mikko on the nice list", "mark Lumi as naughty", "seal Iida nice"
 if(kids.length&&/(mark|seal|stamp|put .* on|move .* to|make .* (nice|naught)|my (call|decision)|i decide|final(ly)? (verdict|decision)?|declare|is officially)/.test(l)&&bandWord(l)&&!/\b(delete|erase|remove|edit)\b/.test(l)){
  return stampHTML(kids[0].name,bandWord(l))}
 // Santa's note: "note for Aino: baked cookies"
 if(/^(santa'?s )?note\b|add (a )?(santa'?s )?note|^actually\b|^fyi\b|^also\b|i (saw|heard|noticed)/.test(l)){
  if(!kids.length)return`<p>Happy to take a note! Who is it about? Try: <i>"note for ${esc(first(KIDS[0].name))}: shared cookies with the reindeer"</i>.</p>`;
  const k=kids[0];let txt=t.includes(':')?t.slice(t.indexOf(':')+1):t.replace(new RegExp('.*?'+first(k.name)+'(\\s+'+(k.name.split(/\s+/)[1]||'')+')?','i'),'');txt=txt.replace(/^[\s,–-]+/,'').trim();
  return noteHTML(k.name,txt,0.93)}
 if(/\b(delete|remove|erase|edit|change|update|modify|rewrite|overwrite|insert)\b/.test(l)){
  const k=kids[0];return`<div class="refuse"><p><b>I can't change the elves' list, Santa.</b> 🔒 Their records stay exactly as they wrote them.</p><p>But you're the boss of the <i>verdict</i>. You can add a <b>✍️ Santa's note</b> with new information, or stamp a <b>🖋 Santa's seal</b>. Both sit beside the list, not in it.</p></div>${k?'<div style="margin-top:10px">'+card(k)+'</div>':''}`}
 if(/(tired|exhausted|stress|overwhelm|\bsad\b|can'?t do this|so much|burn|help me|väsy|kiire|sleepy)/.test(l)){
  const r=KIDS.filter(k=>k.final==='rev').length,good=KIDS.filter(k=>k.final==='nice'||k.final==='lean').length;
  return`<div class="cocoa"><p>☕ <b>Deep breath, Santa.</b></p><p>Here's the real picture: <b>${good} of ${KIDS.length}</b> children are already sorted as nice. Only <b>${r}</b> need your judgement, and I've lined them up for you.</p><p>You've done this every year for a very long time, and you've never missed a chimney. Mrs. Claus just made cocoa. Ten minutes won't change the list. I promise. 😉</p></div>`}
 if(/(review|unsure|borderline|tricky|difficult|unclear|need.*(me|my)|queue)/.test(l)){
  const rev=(place?inPlace(place):KIDS).filter(k=>k.final==='rev');
  return rev.length?`<p>🔎 <b>${rev.length} child${rev.length>1?'ren need':' needs'} your judgement</b>${place?' in '+esc(place.v):''}. I don't guess, so these are yours:</p>${listHTML(rev,reasonChips)}<p class="vc-meta">Tap a name for the evidence, then stamp your seal.</p>`:`<p>Nobody${place?' in '+esc(place.v):''} needs a second look. 🎉</p>`}
 if(kids.length)return kids.slice(0,3).map(k=>card(k)).join('<hr style="border:0;border-top:2px dashed #DCCFB6;margin:14px 0">');
 if(place)return`<p>${flag(inPlace(place)[0]?.country)} Here's how ${esc(place.v)} is doing:</p>`+summary(inPlace(place),place.v);
 if(/(nicest|best|top|kindest|star|angel)/.test(l)){const t3=KIDS.slice(0,3);return`<p>🌟 The brightest stars on this year's list:</p>${listHTML(t3,k=>` <b>+${k.score.toFixed(2)}</b>`)}`}
 if(/(naught|coal|worst|\bbad\b)/.test(l)){const n=KIDS.filter(k=>k.final==='nudge');return n.length?`<p>I don't label any child as "bad", but <b>${n.length}</b> ${n.length>1?'have':'has'} a pattern worth a gentle nudge:</p>${listHTML(n)}<p class="sign">My suggestion for all of them: a smaller gift and a kind note. Hope works better than coal.</p>`:'<p>Nobody needs a nudge this year. Truly a Christmas miracle.</p>'}
 if(/(gift|wish|present|workshop|toy)/.test(l)){const ok=KIDS.filter(k=>(k.final==='nice'||k.final==='lean')&&k.wish);return`<p>🛠 <b>${ok.length}</b> wishes are approved for the workshop:</p><ul class="mini-list">${ok.map(k=>`<li data-kid="${esc(k.name)}">🎁 <span><span class="nm">${esc(first(k.name))}</span>: ${esc(k.wish)}</span></li>`).join('')}</ul>`}
 if(/(improv|redemption|grow|turned|changed|better)/.test(l)){const g=KIDS.filter(k=>k.trend==='improving');return g.length?`<p>📈 These children turned their year around. Recent months count more, so they get the credit:</p>${listHTML(g)}`:'<p>No big turnarounds this year.</p>'}
 if(/(summary|overview|world|everyone|\ball\b|status|how.*(going|doing)|stats|numbers)/.test(l))return'<p>🌍 The whole world, at a glance:</p>'+summary(KIDS,'Everyone');
 if(/(who are you|what can you|help|how do you|what do you)/.test(l))return`<p>I'm <b>ELFRED</b>, your new Head Elf. I read the list, <b>never change it</b>, and help you decide. Try:</p><ul><li>"Is ${esc(first(KIDS[0].name))} nice?" for a verdict with evidence</li><li>"Who needs my review?"</li><li>"How is ${esc(KIDS[0].country)} doing?"</li><li>"Which wishes are approved?"</li><li>"Note for ${esc(first(KIDS[1].name))}: helped the elves wrap presents"</li><li>"Put ${esc(first(KIDS[2].name))} on the nice list" (your seal)</li></ul>`;
 if(/^(hi|hello|hey|moi|hei|terve|ho ho)/.test(l))return'<p>'+pick(['Hello Santa! The list is open and nothing\'s on fire. Yet. 🎄','Good to see you, Santa. ELFRED reporting for duty. Read-only, as promised.'])+'</p>';
 return`<p>Hmm, I couldn't find that on the list. 🤔 I only know what the elves wrote down, and I won't make things up.</p><p>Try a child's name (${KIDS.slice(0,3).map(k=>esc(first(k.name))).join(', ')}…), a country, or "who needs my review?"</p>`}

function noteHTML(name,text,doy){
 if(!text)return`<p>What should I note about ${esc(first(name))}? Write it after a colon, like <i>"note for ${esc(first(name))}: shared cookies with the reindeer"</i>.</p>`;

 const before=K(name);(OV.notes[name]=OV.notes[name]||[]).push({text,doy,ts:Date.now()});saveOV();recompute();const after=K(name);

 return`<p>✍️ <b>Noted, Santa.</b> I read that as <b>${esc(s.cat)}</b> (<span class="delta" style="color:${s.w>0?'#1F5C45':'#B8283A'}">${s.w>0?'+':''}${s.w.toFixed(1)}</span>). Score ${before.score.toFixed(2)} → <b>${after.score.toFixed(2)}</b>.</p>
 ${moved?`<p>🎉 That changes things: <span class="band ${BANDS[before.final][1]}">${BANDS[before.final][0]}</span> → <span class="band ${BANDS[after.final][1]}">${BANDS[after.final][0]}</span></p>`:`<p class="vc-meta">Still <b>${BANDS[after.final][0]}</b>${Math.abs(d)<0.01?'':' but the needle moved'}.</p>`}
 <p class="vc-meta">🔒 The elves' list is untouched. Your note lives beside it.</p><div style="margin-top:8px">${card(after,before.score)}</div>`}
function stampHTML(name,band){const k=K(name);OV.seals[name]=band;saveOV();recompute();const a=K(name);const B=BANDS[band];
 return`<p>🖋 <b>Sealed.</b></p><div style="text-align:center"><span class="stamp" style="color:${B[2]==='#8FBF8A'?'#3E7A3A':B[2]==='#E9B44C'?'#9A6B12':B[2]}">${B[0].toUpperCase()}</span><br><span class="vc-meta">${esc(name)} · by order of S. Claus</span></div>
 ${a.band!==band?`<p>ELFRED respectfully notes that the evidence pointed to <b>${BANDS[a.band][0]}</b>. But that's exactly how it should work: <b>you</b> decide. 🎅</p>`:`<p>Same as my recommendation. Great minds think alike. 🤝</p>`}
 <p class="vc-meta">Stored as Santa's decision, next to the list. The elves' records are unchanged.</p><div style="margin-top:8px">${card(a)}</div>`}
